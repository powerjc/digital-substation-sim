# Digital Substation Simulator: the static app in a hardened nginx container.
#   docker compose up -d --build        → http://localhost:8081
# Only Docker is needed on the machine (no Node). Update: git pull, then the
# same command. Other machines on the network: BIND=0.0.0.0:8081 docker compose up -d --build
# Public hosting: keep the loopback default and put the host's nginx in front
# for TLS and access control (app/deploy/nginx-host.conf.example).
# Port 8081 by default, so it can run next to the Line Protection Simulator (8080).
services:
  web:
    build: ./app
    image: digital-substation-sim:${IMAGE_TAG:-latest}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp # nginx pid + temp files (unprivileged image keeps them here)
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - ${BIND:-127.0.0.1:8081}:8080
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
